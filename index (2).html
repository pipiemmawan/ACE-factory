<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE兵工廠分配</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --badge-bg: #334155;
            --commander: #8b5cf6;
            --danger: #ef4444;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        header h1 { margin: 0; font-size: 1.8rem; color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.3); }

        .admin-toggle-btn { background-color: #334155; color: #f8fafc; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .admin-toggle-btn:hover { background-color: #475569; border-color: var(--accent); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-header h2 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; color: #f8fafc; }

        .btn { background-color: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn.success { background-color: var(--success); }
        .btn.danger { background-color: var(--danger); }
        .btn.danger:hover { background-color: #dc2626; }

        .admin-panel { display: none; background-color: #111827; border: 2px solid var(--accent); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-panel.open { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }

        .admin-group label { display: block; font-weight: bold; color: #93c5fd; margin-bottom: 6px; font-size: 0.95rem; }
        .admin-textarea { width: 100%; height: 200px; background-color: #0f172a; color: var(--text-color); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.85rem; resize: vertical; box-sizing: border-box; }
        .admin-textarea:focus { outline: none; border-color: var(--accent); }
        .admin-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }

        .search-box { width: 100%; padding: 10px 14px; background-color: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text-color); font-size: 0.95rem; box-sizing: border-box; margin-bottom: 15px; }
        .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }

        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .building-item { background-color: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 8px; padding: 14px; transition: all 0.2s; }
        .building-item.unassigned-card { border-color: var(--warning); background-color: rgba(245, 158, 11, 0.05); grid-column: 1 / -1; }

        .building-name { font-weight: bold; color: #93c5fd; margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 6px; font-size: 1.05rem; }
        .building-name.unassigned-title { color: #fcd34d; border-bottom-color: rgba(245, 158, 11, 0.3); }

        .member-chips { display: flex; flex-direction: column; gap: 6px; }
        .member-chip { display: flex; justify-content: space-between; align-items: center; background-color: var(--badge-bg); padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: all 0.15s; }
        .member-chip:hover { border-color: var(--accent); background-color: rgba(59, 130, 246, 0.15); transform: translateY(-1px); }
        .member-chip.selected { border-color: var(--warning); background-color: rgba(245, 158, 11, 0.25); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
        .member-chip.hidden-by-search { display: none !important; }

        .member-name { font-weight: 500; color: #f8fafc; }
        .member-power { font-family: monospace; color: #38bdf8; font-weight: bold; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }

        .commander-notice { color: #c4b5fd; font-style: italic; text-align: center; padding: 10px; background: rgba(139, 92, 246, 0.1); border-radius: 6px; border: 1px dashed rgba(139, 92, 246, 0.3); font-size: 0.95rem; }

        textarea.output-textarea { width: 100%; height: 180px; background-color: #0f172a; color: var(--text-color); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; resize: vertical; box-sizing: border-box; }
        .meta-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .hint-text { color: var(--warning); font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>⚔️ ACE兵工廠分配</h1>
        <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ 管理員設定 (修改名單)</button>
    </header>

    <div class="admin-panel" id="adminPanel">
        <h3 style="margin-top: 0; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 8px;">🔧 網站後台：編輯各軍團名單與戰力</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">請直接修改下方文字框（每行一個：<code>名字 戰力</code>），修改後點擊儲存，資料會自動實時更新並儲存喺你部瀏覽器入面。</p>
        <div class="admin-grid">
            <div class="admin-group">
                <label>🛡️ 軍團一 成員名單 (Members)</label>
                <textarea id="adminLegion1Members" class="admin-textarea"></textarea>
            </div>
            <div class="admin-group">
                <label>🛡️ 軍團一 尚未分配/候補 (Unassigned)</label>
                <textarea id="adminLegion1Unassigned" class="admin-textarea"></textarea>
            </div>
            <div class="admin-group">
                <label>⚔️ 軍團二 成員名單 (Members)</label>
                <textarea id="adminLegion2Members" class="admin-textarea"></textarea>
            </div>
            <div class="admin-group">
                <label>⚔️ 軍團二 尚未分配/候補 (Unassigned)</label>
                <textarea id="adminLegion2Unassigned" class="admin-textarea"></textarea>
            </div>
        </div>
        <div class="admin-actions">
            <button class="btn danger" onclick="resetDataToDefault()">🔄 還原預設名單</button>
            <button class="btn success" onclick="saveAdminData()">💾 儲存並更新名單</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchLegion('legion1')">🛡️ 軍團一 (Legion 1)</button>
        <button class="tab-btn tab-btn-2" onclick="switchLegion('legion2')">⚔️ 軍團二 (Legion 2)</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>📋 分配名單 (純名字，可直接複製)</h2>
            <button class="btn" id="copyBtn" onclick="copyList()">一鍵複製名單</button>
        </div>
        <div class="meta-info">
            <div>
                <span>已分配人數：<span id="totalMembers">0</span> 人</span> |
                <span>尚未分配：<span id="unassignedCount">0</span> 人</span>
            </div>
            <span class="hint-text">💡 提示：點擊任意兩位成員可對調</span>
        </div>
        <textarea id="outputList" class="output-textarea" readonly></textarea>
    </div>

    <div class="card">
        <div class="card-header"><h2>⚡ 設施人員安排</h2></div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋成員名稱（即時過濾）..." oninput="filterMembers()">
        <div class="building-grid" id="buildingGrid"></div>
    </div>
</div>

<script>
    const defaultData = {
        legion1: {
            members: [
                "熊爺爺 12881", "Oldman 8133", "Gyu 8393", "Tatamee 7913", "渡菇 7622",
                "DM 7563", "DIDU 7492", "MC 6408", "珠珠 6863", "鹹魚 5214",
                "灰太狼 5329", "黑手 5242", "吉的 5196", "艾林 4958", "Boy 4907",
                "雨太陽 4836", "YOUG 4670", "白咕 4727", "笑口常開 4720", "Xavi 4669",
                "喜羊羊 4663", "黑菇 3998", "Xenia 3324"
            ],
            unassigned: [
                "Highball 5403", "小批 5205", "葫蘆娃 5187", "房東 4745",
                "BenLdn 4486", "Autum 4346", "Lkc 4230", "拿鐵 4180",
                "New new 4072", "五二零 4052", "EDM 3832"
            ]
        },
        legion2: {
            members: [
                "Nittako 6667", "JCG 6247", "Lonely 5722", "湯馬士 5404", "Johnson 5322",
                "Reaper 5293", "牛排 5290", "魔影 5114", "小塵埃 5112", "Nini 4972",
                "Alyssa 5001", "Casey 4827", "Haha 4825", "Pyp 4755", "Duke 4620",
                "Lin 4505", "雪星 4362", "Freezee 4353", "東西 4213", "布偶貓 4211",
                "白黑貓 3999", "Katy 3968", "Hikari 3758", "Hao 3140"
            ],
            unassigned: [
                "Highball 5403", "小批 5205", "葫蘆娃 5187", "房東 4745",
                "BenLdn 4486", "Autum 4346", "Lkc 4230", "拿鐵 4180",
                "New new 4072", "五二零 4052", "EDM 3832"
            ]
        }
    };

    let initialData = JSON.parse(localStorage.getItem('ace_factory_data')) || JSON.parse(JSON.stringify(defaultData));

    let currentLegion = 'legion1';
    let selectedMember = null;

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
            loadAdminTextareas();
        }
    }

    function loadAdminTextareas() {
        document.getElementById('adminLegion1Members').value = initialData.legion1.members.join('\n');
        document.getElementById('adminLegion1Unassigned').value = initialData.legion1.unassigned.join('\n');
        document.getElementById('adminLegion2Members').value = initialData.legion2.members.join('\n');
        document.getElementById('adminLegion2Unassigned').value = initialData.legion2.unassigned.join('\n');
    }

    function saveAdminData() {
        try {
            const parseLines = (text) => text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

            initialData.legion1.members = parseLines(document.getElementById('adminLegion1Members').value);
            initialData.legion1.unassigned = parseLines(document.getElementById('adminLegion1Unassigned').value);
            initialData.legion2.members = parseLines(document.getElementById('adminLegion2Members').value);
            initialData.legion2.unassigned = parseLines(document.getElementById('adminLegion2Unassigned').value);

            localStorage.setItem('ace_factory_data', JSON.stringify(initialData));
            selectedMember = null;
            renderData();
            toggleAdminPanel();
            alert('✅ 儲存成功！網頁名單已更新。');
        } catch (e) {
            alert('❌ 儲存失敗，請檢查格式是否有誤。');
        }
    }

    function resetDataToDefault() {
        if (confirm('⚠️ 確定要還原為預設名單嗎？所有手動修改將會清除。')) {
            localStorage.removeItem('ace_factory_data');
            initialData = JSON.parse(JSON.stringify(defaultData));
            selectedMember = null;
            renderData();
            loadAdminTextareas();
            toggleAdminPanel();
            alert('🔄 已成功還原預設名單！');
        }
    }

    function switchLegion(legionKey) {
        currentLegion = legionKey;
        selectedMember = null;
        document.getElementById('searchInput').value = '';
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(legionKey === 'legion1' ? '.tab-btn' : '.tab-btn-2').classList.add('active');
        renderData();
    }

    function parseMember(str) {
        const lastSpace = str.lastIndexOf(' ');
        if (lastSpace === -1) return { name: str, power: 0, raw: str };
        return {
            name: str.substring(0, lastSpace),
            power: parseInt(str.substring(lastSpace + 1), 10) || 0,
            raw: str
        };
    }

    function handleMemberClick(rawStr, category) {
        if (!selectedMember) {
            selectedMember = { rawStr, category };
            renderData();
        } else {
            if (selectedMember.rawStr === rawStr) {
                selectedMember = null;
            } else {
                swapMembers(selectedMember, { rawStr, category });
                selectedMember = null;
            }
            renderData();
        }
    }

    function swapMembers(m1, m2) {
        const currentData = initialData[currentLegion];
        const idx1 = currentData.members.indexOf(m1.rawStr);
        const idx2 = currentData.members.indexOf(m2.rawStr);

        if (idx1 !== -1 && idx2 !== -1) {
            currentData.members[idx1] = m2.rawStr;
            currentData.members[idx2] = m1.rawStr;
        } else {
            if (idx1 !== -1) {
                currentData.members[idx1] = m2.rawStr;
                const uIdx = currentData.unassigned.indexOf(m2.rawStr);
                if (uIdx !== -1) currentData.unassigned[uIdx] = m1.rawStr;
            } else if (idx2 !== -1) {
                currentData.members[idx2] = m1.rawStr;
                const uIdx = currentData.unassigned.indexOf(m1.rawStr);
                if (uIdx !== -1) currentData.unassigned[uIdx] = m2.rawStr;
            } else {
                const u1 = currentData.unassigned.indexOf(m1.rawStr);
                const u2 = currentData.unassigned.indexOf(m2.rawStr);
                if (u1 !== -1 && u2 !== -1) {
                    currentData.unassigned[u1] = m2.rawStr;
                    currentData.unassigned[u2] = m1.rawStr;
                }
            }
        }
        localStorage.setItem('ace_factory_data', JSON.stringify(currentData));
    }

    function filterMembers() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const chips = document.querySelectorAll('.member-chip');

        chips.forEach(chip => {
            const name = chip.getAttribute('data-name').toLowerCase();
            if (query === '' || name.includes(query)) {
                chip.classList.remove('hidden-by-search');
            } else {
                chip.classList.add('hidden-by-search');
            }
        });
    }

    function seededShuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function renderData() {
        const currentData = initialData[currentLegion];
        const rawList = currentData.members;
        const members = rawList.map(parseMember);

        // 依戰力由高到低排
        members.sort((a, b) => b.power - a.power);

        // 1. 決定六個建築物嘅隊長（按戰力排名分配，軍團一排除 Gyu，軍團二排除 Reaper）
        let top6Captains = [];
        for (let m of members) {
            if (top6Captains.length >= 6) break;
            if (currentLegion === 'legion1' && m.name.toUpperCase() === 'GYU') continue;
            if (currentLegion === 'legion2' && m.name.toUpperCase() === 'REAPER') continue;
            top6Captains.push(m);
        }
        const captainRawSet = new Set(top6Captains.map(c => c.raw));

        // 2. 決定游擊小隊 (3人)：固定核心人物 + 戰力第七同第八名
        let guerrillaMembers = [];
        if (currentLegion === 'legion1') {
            const gyuObj = members.find(m => m.name.toUpperCase() === 'GYU');
            if (gyuObj) guerrillaMembers.push(gyuObj.raw);
        } else {
            const reaperObj = members.find(m => m.name.toUpperCase() === 'REAPER');
            if (reaperObj) guerrillaMembers.push(reaperObj.raw);
        }
        // 加入戰力第七 (index 6) 同第八 (index 7)
        if (members[6]) guerrillaMembers.push(members[6].raw);
        if (members[7]) guerrillaMembers.push(members[7].raw);

        const guerrillaRawSet = new Set(guerrillaMembers);

        // 3. 剩下可用於建築物及採集嘅成員（排除隊長同游擊隊）
        const availablePool = members.filter(m => !captainRawSet.has(m.raw) && !guerrillaRawSet.has(m.raw));

        const b1Extra = availablePool.slice(0, 3);
        const b2Extra = availablePool.slice(3, 6);
        const usedExtraSet = new Set([...b1Extra, ...b2Extra].map(m => m.raw));

        const remainingForRepair = availablePool.filter(m => !usedExtraSet.has(m.raw));
        const repairShops = [[], [], [], []];
        remainingForRepair.forEach((m, idx) => {
            repairShops[idx % 4].push(m.raw);
        });

        // 4. 採集小隊：從「隊長以外」嘅剩餘成員入面隨機 8 位
        const nonCaptainPool = members.filter(m => !captainRawSet.has(m.raw));
        if (!window['random_' + currentLegion]) {
            window['random_' + currentLegion] = seededShuffle([...nonCaptainPool]);
        }
        const gatheringMembersRaw = window['random_' + currentLegion].slice(0, 8).map(m => m.raw);

        const dcNoticeText = currentLegion === 'legion1' ? "軍團1頻道" : "軍團二頻道或妮妮專線";

        const buildings = [
            { name: "🎧 DC頻道", type: "commander", customNotice: dcNoticeText },
            { name: "🎯 1號武器試驗場", members: [top6Captains[0].raw, ...b1Extra.map(m => m.raw)] },
            { name: "🎯 2號武器試驗場", members: [top6Captains[1].raw, ...b2Extra.map(m => m.raw)] },
            { name: "🔧 1號武器維修廠", members: [top6Captains[2].raw, ...repairShops[0]] },
            { name: "🔧 2號武器維修廠", members: [top6Captains[3].raw, ...repairShops[1]] },
            { name: "🔧 3號武器維修廠", members: [top6Captains[4].raw, ...repairShops[2]] },
            { name: "🔧 4號武器維修廠", members: [top6Captains[5].raw, ...repairShops[3]] },
            { name: "📡 中繼站", type: "commander", customNotice: "由指揮官安排" },
            { name: "🔥 蒸汽鍋爐", type: "commander", customNotice: "由指揮官安排" },
            { name: "🏃 游擊小隊", members: guerrillaMembers, noCaptainIcon: true },
            { name: "⛏️ 採集小隊", members: gatheringMembersRaw, noCaptainIcon: true }
        ];

        const grid = document.getElementById('buildingGrid');
        grid.innerHTML = '';

        let totalCount = rawList.length;
        let textOutput = `【 ACE兵工廠分配 - ${currentLegion === 'legion1' ? '軍團一 (Legion 1)' : '軍團二 (Legion 2)'} 】\n`;

        buildings.forEach(b => {
            const item = document.createElement('div');
            item.className = 'building-item';

            if (b.type === 'commander') {
                item.innerHTML = `
                    <div class="building-name">${b.name}</div>
                    <div class="commander-notice">${b.customNotice}</div>
                `;
                textOutput += `\n${b.name}：${b.customNotice}\n`;
            } else {
                let chipsHtml = '';
                b.members.forEach((mStr, index) => {
                    const m = parseMember(mStr);
                    const isSelected = selectedMember && selectedMember.rawStr === mStr;
                    const showCrown = (index === 0 && !b.noCaptainIcon);
                    const displayName = (showCrown ? '👑 ' : '') + m.name;

                    chipsHtml += `
                        <div class="member-chip ${isSelected ? 'selected' : ''}" data-name="${m.name}" onclick="handleMemberClick('${mStr}', '${b.name}')">
                            <span class="member-name">${displayName}</span>
                            <span class="member-power">⚔️ ${m.power}</span>
                        </div>
                    `;
                });
                item.innerHTML = `
                    <div class="building-name">${b.name} <span>(${b.members.length}人)</span></div>
                    <div class="member-chips">${chipsHtml}</div>
                `;
                textOutput += `\n${b.name}：\n` + b.members.map((mStr, index) => {
                    const showCrown = (index === 0 && !b.noCaptainIcon);
                    return `• ${showCrown ? '👑 ' : ''}${parseMember(mStr).name}`;
                }).join('\n') + `\n`;
            }
            grid.appendChild(item);
        });

        let unassignedChipsHtml = '';
        currentData.unassigned.forEach(mStr => {
            const m = parseMember(mStr);
            const isSelected = selectedMember && selectedMember.rawStr === mStr;
            unassignedChipsHtml += `
                <div class="member-chip ${isSelected ? 'selected' : ''}" data-name="${m.name}" onclick="handleMemberClick('${mStr}', 'unassigned')">
                    <span class="member-name">${m.name}</span>
                    <span class="member-power">⚔️ ${m.power}</span>
                </div>
            `;
        });

        const unassignedCard = document.createElement('div');
        unassignedCard.className = 'building-item unassigned-card';
        unassignedCard.innerHTML = `
            <div class="building-name unassigned-title">⚠️ 尚未分配 / 候補人員 <span>(${currentData.unassigned.length}人)</span></div>
            <div class="member-chips">${unassignedChipsHtml}</div>
        `;
        grid.appendChild(unassignedCard);

        textOutput += `\n⚠️ 尚未分配 / 候補人員：\n` + currentData.unassigned.map(mStr => `• ${parseMember(mStr).name}`).join('\n');

        document.getElementById('totalMembers').textContent = totalCount;
        document.getElementById('unassignedCount').textContent = currentData.unassigned.length;
        document.getElementById('outputList').value = textOutput.trim();

        filterMembers();
    }

    function copyList() {
        const textarea = document.getElementById('outputList');
        textarea.select();
        document.execCommand('copy');

        const btn = document.getElementById('copyBtn');
        btn.textContent = '已複製！';
        btn.classList.add('success');
        setTimeout(() => {
            btn.textContent = '一鍵複製名單';
            btn.classList.remove('success');
        }, 2000);
    }

    renderData();
</script>
</body>
</html>
